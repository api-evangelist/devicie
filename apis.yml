aid: devicie
name: Devicie
description: >-
  Devicie is an Intune-native device management and endpoint security platform that automates the
  deployment, configuration, patching, and ongoing maintenance of Microsoft Intune at scale for
  enterprises and managed service providers. Built natively on Microsoft Intune and vendor-agnostic
  across Windows, macOS, Apple iOS, and Android, Devicie handles application management and patching,
  tenant configuration with automated remediation, continuous compliance and audit readiness, Modern
  Work Vitals device visibility, and security vulnerability management. It administers customer tenants
  through the Microsoft Graph API via an Entra ID enterprise application rather than exposing its own
  public developer API. Devicie is backed by Insight Partners.
